<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAYRA — Pathways</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- TOP HEADER / NAV -->
  <header class="navbar">
    <div class="logo-box">
      <div class="logo-icon">K</div>
      <div class="logo-text">KAYRA</div>
    </div>
    <div class="brand-sub">A VISION OF SAHITH KANKARA AND ANANYA BONALA.</div>
    <nav class="nav-links">
      <a href="#home">HOME</a>
      <a href="#about">ABOUT</a>
      <a href="#skills">SKILLS</a>
      <a href="#pathways" class="active">PATHWAYS</a>
      <a href="#philosophy">PHILOSOPHY</a>
      <a href="#start">START</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>

  <!-- MAIN SLIDER WRAPPER -->
  <main class="viewport">
    
    <!-- SLIDE 1: MAIN PATHWAY BUTTONS -->
    <section id="slide-main" class="slide active">
      <div class="section-tag">03 / PATHWAYS</div>
      <h1 class="hero-heading">YOUR NEXT <span class="glow-text">PATH.</span></h1>

      <div class="buttons-container">
        <!-- Button 10th -->
        <button class="path-btn" onclick="openCategory('10th')">
          <div class="btn-num">01</div>
          <div class="btn-info">
            <h2>AFTER 10TH</h2>
            <p>Explore streams, subjects, and directions for the next stage.</p>
          </div>
          <div class="btn-arrow">&rarr;</div>
        </button>

        <!-- Button 12th -->
        <button class="path-btn" onclick="openCategory('12th')">
          <div class="btn-num">02</div>
          <div class="btn-info">
            <h2>AFTER 12TH</h2>
            <p>Understand courses, careers, universities, and opportunities.</p>
          </div>
          <div class="btn-arrow">&rarr;</div>
        </button>

        <!-- Button Global -->
        <button class="path-btn" onclick="openCategory('global')">
          <div class="btn-num">03</div>
          <div class="btn-info">
            <h2>GLOBAL OPTIONS</h2>
            <p>Discover international schools, universities, and global pathways.</p>
          </div>
          <div class="btn-arrow">&rarr;</div>
        </button>
      </div>
    </section>

    <!-- SLIDE 2: DETAIL VIEW (HIDDEN UNTIL CLICKED) -->
    <section id="slide-detail" class="slide">
      <div class="detail-header">
        <button class="back-btn" onclick="goBackMain()">&larr; BACK TO PATHWAYS</button>
        <span class="category-tag" id="detail-tag">03 / AFTER 10TH</span>
      </div>

      <div class="detail-grid">
        <!-- Left Pane: Streams List -->
        <div class="streams-panel">
          <h3 class="panel-title">SELECT OPTION</h3>
          <div class="options-list" id="options-container"></div>
        </div>

        <!-- Right Pane: Stream Specs & Top Institutions -->
        <div class="specs-panel">
          <div class="spec-header">
            <h2 id="stream-title">SCIENCE (PCM)</h2>
            <div class="diff-block">
              <span class="diff-label">DIFFICULTY LEVEL: <strong id="diff-value">85%</strong></span>
              <div class="diff-bar-bg">
                <div class="diff-bar-fill" id="diff-bar"></div>
              </div>
            </div>
          </div>

          <h4 class="section-subtitle">TOP 3 INSTITUTIONS / SCHOOLS</h4>
          <div class="cards-grid" id="institutions-container"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- BOTTOM FOOTER NAV -->
  <footer class="footer-nav">
    <span>&larr; PREVIOUS</span>
    <span class="slide-count">04 / 07</span>
    <span>NEXT &rarr;</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
